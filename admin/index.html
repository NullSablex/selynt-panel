<script type="module">
import { t } from '<?= $pluginBase ?>/images/assets/js/script.min.js?v=<?= $v ?>';
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);}
function uptime(ts){
  let s=Math.floor(Date.now()/1000-ts);
  if(s<60)return t('time.now');
  const u=[
    [31536000,'time.year','time.years'],
    [2592000,'time.month','time.months'],
    [86400,'time.day','time.days'],
    [3600,'time.hour','time.hours'],
    [60,'time.minute','time.minutes'],
  ];
  const p=[];
  for(const[d,sg,pl] of u){
    const v=Math.floor(s/d);
    if(v>0){p.push(v+' '+t(v===1?sg:pl));s%=d;}
    if(p.length===2)break;
  }
  return p.join(t('time.connector'));
}
function typeIcon(ty){
  if(ty==='node') return '<i class="fa-brands fa-node-js icon-node"></i>';
  if(ty==='rust') return '<i class="fa-solid fa-gears"></i>';
  return '<i class="fa-solid fa-cube"></i>';
}
function typeLabel(ty){
  if(ty==='node') return t('type.node');
  if(ty==='rust') return t('type.rust');
  return ty.charAt(0).toUpperCase()+ty.slice(1);
}
// CPU é contador acumulado: a taxa sai do delta entre dois refreshes da
// tabela (15s), sem custo extra de requisição.
const cpuPrev={};
function cellId(a){return String(a.user+'-'+a.name).replace(/[^A-Za-z0-9_-]/g,'_');}
function tableSignature(apps){
  return apps.map(a=>[a.user,a.name,a.type,a.host,a.status,a.pid].join('|')).join('~');
}
let lastTableSig=null;
function fmtBytes(b){
  if(!b)return'—';
  const mb=b/1048576;
  return mb>=1024?(mb/1024).toFixed(1)+' GB':Math.round(mb)+' MB';
}
function cpuCell(key,usec){
  if(usec==null)return null;
  const now=Date.now(),prev=cpuPrev[key];
  cpuPrev[key]={usec,at:now};
  if(!prev||now<=prev.at||usec<prev.usec)return null;
  return((usec-prev.usec)/((now-prev.at)*1000)*100).toFixed(1)+'%';
}

async function load(){
  const r=await fetch('/CMD_PLUGINS_ADMIN/selynt_panel/api/overview.raw').then(r=>r.json()).catch(()=>null);
  if(!r||!r.ok){document.getElementById('sly-table').innerHTML='<p class="alert-error">'+esc(t('errors.load_apps'))+'</p>';return;}
  const apps=r.apps||[];
  const users=[...new Set(apps.map(a=>a.user))];
  const run=apps.filter(a=>a.status==='RUNNING').length;
  document.getElementById('stat-users').textContent=users.length;
  document.getElementById('stat-total').textContent=apps.length;
  document.getElementById('stat-run').textContent=run;
  if(!apps.length){document.getElementById('sly-table').innerHTML='<p class="text-muted">'+esc(t('admin.overview.none'))+'</p>';return;}
  const dash=t('app.log.dash');
  // Só remonta a tabela quando algo estrutural muda; caso contrário atualiza
  // apenas as células de CPU e memória, para não piscar a cada 15s.
  const sig=tableSignature(apps);
  if(sig===lastTableSig&&document.querySelector('#sly-table tbody')){
    apps.forEach(a=>{
      const id=cellId(a);
      const c=document.getElementById('cpu-'+id);
      const m=document.getElementById('mem-'+id);
      if(c)c.textContent=cpuCell(a.user+'/'+a.name,a.cpu_usec)||dash;
      if(m)m.textContent=a.memory?fmtBytes(a.memory):dash;
    });
    return;
  }
  lastTableSig=sig;
  document.getElementById('sly-table').innerHTML=`<div class="table-scroll"><table class="apps-table"><thead><tr><th>${esc(t('admin.overview.col.user'))}</th><th>${esc(t('admin.overview.col.app'))}</th><th>${esc(t('admin.overview.col.type'))}</th><th>${esc(t('admin.overview.col.host'))}</th><th>${esc(t('admin.overview.col.status'))}</th><th>${esc(t('admin.overview.col.uptime'))}</th><th>${esc(t('admin.overview.col.cpu'))}</th><th>${esc(t('admin.overview.col.memory'))}</th><th>${esc(t('admin.overview.col.pid'))}</th></tr></thead><tbody>${
    apps.map(a=>`<tr><td>${esc(a.user)}</td><td>${esc(a.name)}</td><td>${typeIcon(a.type)} ${esc(typeLabel(a.type))}</td><td><code class="code-muted">${esc(a.host)}</code></td><td><span class="badge ${a.status==='RUNNING'?'badge-online':'badge-offline'}">${esc(a.status==='RUNNING'?t('apps.online'):t('apps.offline'))}</span></td><td>${a.status==='RUNNING'&&a.started_at?uptime(a.started_at):dash}</td><td id="cpu-${cellId(a)}">${cpuCell(a.user+'/'+a.name,a.cpu_usec)||dash}</td><td id="mem-${cellId(a)}">${a.memory?esc(fmtBytes(a.memory)):dash}</td><td>${a.pid||dash}</td></tr>`).join('')
  }</tbody></table></div>`;
}
load();setInterval(load,15000);
</script>
