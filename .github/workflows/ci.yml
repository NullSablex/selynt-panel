name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  packages: none
  actions: none
  issues: none
  pull-requests: none

jobs:
  check:
    name: Build & Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Build assets
        run: npm run build

      - name: Verify minified files exist
        run: |
          test -f images/assets/css/panel.min.css || { echo "panel.min.css missing"; exit 1; }
          for f in dom i18n notify lang theme viewport ui \
                   page-app page-apps page-dashboard page-create page-settings \
                   page-admin page-config page-diagnostic; do
            test -f "images/assets/js/$f.min.js" || { echo "$f.min.js missing"; exit 1; }
          done

      - name: Validate plugin.conf
        run: |
          grep -q '^name=' plugin.conf || { echo "plugin.conf missing name"; exit 1; }
          grep -q '^version=' plugin.conf || { echo "plugin.conf missing version"; exit 1; }

      - name: Version sync check
        run: |
          CONF_VER=$(awk -F= '$1=="version"{print $2; exit}' plugin.conf | tr -d '[:space:]')
          FILE_VER=$(tr -d '[:space:]' < version)
          if [ "$CONF_VER" != "$FILE_VER" ]; then
            echo "ERRO: plugin.conf ($CONF_VER) e version ($FILE_VER) dessincronizados"
            exit 1
          fi
          echo "OK — versão $CONF_VER"

      - name: Check PHP syntax
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq php-cli > /dev/null
          ERR=0
          while IFS= read -r f; do
            php -l "$f" 2>&1 | grep -v 'No syntax errors' && ERR=1 || true
          done < <(
            # As páginas de user/ e admin/ não têm extensão: o DirectAdmin executa
            # o arquivo cujo nome bate com o caminho pedido. Filtrar por extensão
            # deixaria justamente os maiores arquivos PHP de fora.
            { find lib hooks -type f \( -name '*.php' -o -name '*.html' -o -name '*.raw' \)
              find user admin -type f ! -name '*.md'
            } | sort -u
          )
          exit $ERR

      - name: Check shell scripts syntax
        run: |
          bash -n install.sh
          find scripts -name '*.sh' -exec bash -n {} \;
