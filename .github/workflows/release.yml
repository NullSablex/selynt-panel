name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: none
  actions: none
  issues: none
  pull-requests: none

jobs:
  build:
    name: Build Plugin Package
    runs-on: ubuntu-latest
    permissions:
      contents: write   # anexa o pacote à release publicada
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Build minified assets
        run: npm run build

      - name: Read version
        id: ver
        run: |
          VERSION=$(tr -d '[:space:]' < version)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set file permissions
        run: |
          # Permissões uniformes (755) — modelo padrão DA plugins
          find . -type d -exec chmod 755 {} \;
          find . -type f -exec chmod 755 {} \;

          # plugin.conf: 644 (DA reescreve, diradmin precisa ler)
          chmod 644 plugin.conf

      - name: Package plugin
        run: |
          tar -czf /tmp/selynt_panel.tar.gz \
            --exclude='node_modules' \
            --exclude='assets-src' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='build-assets.mjs' \
            --exclude='assets.manifest.json' \
            --exclude='packages.md' \
            --exclude='.github' \
            --exclude='.git' \
            --exclude='.gitignore' \
            --exclude='tools' \
            --exclude='notes' \
            --exclude='docs' \
            --exclude='mkdocs.yml' \
            --exclude='SECURITY.md' \
            --exclude='version' \
            --exclude='./install.sh' \
            --exclude='README.md' \
            --exclude='CHANGELOG.md' \
            --exclude='scripts/diag-proxy.sh' \
            --exclude='scripts/package.sh' \
            --exclude='*.tmp' \
            .
          mv /tmp/selynt_panel.tar.gz .

      - name: Verify package
        run: |
          ARCHIVE="selynt_panel.tar.gz"

          echo "Verificando ausência de arquivos dev/build..."
          FORBIDDEN="node_modules|assets-src|package\.json|package-lock|build-assets|assets\.manifest|\.github/|\.git/|\.gitignore|^\./install\.sh$|README\.md|CHANGELOG\.md|SECURITY\.md|^\./tools/|^\./notes/|^\./docs/|mkdocs\.yml"
          if tar -tzf "$ARCHIVE" | grep -qE "$FORBIDDEN"; then
            echo "ERRO: arquivos indevidos encontrados no pacote:"
            tar -tzf "$ARCHIVE" | grep -E "$FORBIDDEN"
            exit 1
          fi
          echo "OK"

          echo "Verificando assets minificados..."
          for f in panel.min.css fontawesome.min.js solid.min.js brands.min.js \
                   dom.min.js i18n.min.js notify.min.js lang.min.js theme.min.js \
                   viewport.min.js ui.min.js page-app.min.js page-apps.min.js \
                   page-dashboard.min.js page-create.min.js page-settings.min.js \
                   page-admin.min.js page-config.min.js page-diagnostic.min.js; do
            tar -tzf "$ARCHIVE" | grep -q "$f" || { echo "FALTANDO: $f"; exit 1; }
          done
          echo "OK"

          echo "Verificando arquivos essenciais..."
          for f in plugin.conf LICENSE lib/common.php; do
            tar -tzf "$ARCHIVE" | grep -q "$f" || { echo "FALTANDO: $f"; exit 1; }
          done
          echo "OK"

          echo "Tamanho do pacote:"
          du -sh "$ARCHIVE"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            selynt_panel.tar.gz \
            --clobber
